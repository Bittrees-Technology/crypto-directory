name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "surf-production"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify source before installing dependencies or building
        run: npm run check:source

      - name: Verify approval policy
        run: node --test test/approval-bot.test.mjs

      - name: Install declared ENS dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify directory roles, intake and review boundaries
        run: npm run test:directory

      - name: Verify transactional catalogue boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s runtime -p 'test_*.py'

      - name: Verify ENS packet and signing boundaries
        run: npm run test:ens

      - name: Verify weekly publishing policy
        run: python3 -m unittest discover -s scripts/ipns -v

      - name: Verify shared session refresh boundaries
        run: node --test scripts/shared-session-refresh.node.mjs

      - name: Build site
        run: npm run build

      - name: Prepare browser validation
        run: npx playwright install --with-deps chromium

      - name: Verify role-based navigation and intake forms
        run: npm run test:directory-browser

      - name: Verify shared runtime catalogue pages without production writes
        env:
          DIRECTORY_DATA_BACKEND: runtime-v1
          DIRECTORY_RUNTIME_STORE_ID: e38a1a2e-3602-4e3b-875b-ac80ce210c90
          DIRECTORY_BUILD_OUTPUT: /tmp/cryptodirectory-runtime-site
        run: |
          node scripts/build.mjs
          node scripts/runtime-browser.mjs

      - name: Build Surf discovery site
        run: npm --prefix surf run build

      - name: Verify Surf identity, refresh, account and embedding boundaries
        run: npm --prefix surf test

      - name: Verify Surf embedded discovery and refresh regressions in Chromium
        run: npm --prefix surf run test:browser

      - name: Check links
        run: node scripts/check-links.mjs
