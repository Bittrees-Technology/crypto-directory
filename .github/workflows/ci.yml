name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify approval policy
        run: node --test test/approval-bot.test.mjs

      - name: Install declared ENS dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify ENS packet and signing boundaries
        run: npm run test:ens

      - name: Verify weekly publishing policy
        run: python3 -m unittest discover -s scripts/ipns -v

      - name: Verify shared session refresh boundaries
        run: node --test scripts/shared-session-refresh.node.mjs

      - name: Build site
        run: npm run build

      - name: Check links
        run: node scripts/check-links.mjs
