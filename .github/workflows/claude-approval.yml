name: Claude approval pilot
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to review
        required: true
        type: string
permissions: {}
concurrency:
  group: claude-approval-pilot
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main' && vars.CLAUDE_APPROVAL_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      envelope: ${{ steps.review.outputs.envelope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.220
      - name: Review immutable PR content with subscription
        id: review
        run: node scripts/approval-bot/run.mjs review
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
  approve:
    needs: review
    if: needs.review.outputs.envelope != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Recheck current commit and CI, then approve only reviewed commit
        run: node scripts/approval-bot/run.mjs approve
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ENVELOPE: ${{ needs.review.outputs.envelope }}
